appId: dev.capitaine.app
productName: Capitaine
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - resources/icon.png
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true

# Auto-updates: the app checks the GitHub releases of this repo (public, so no token needed to update).
# CI publishes them (.github/workflows/release.yml) when a v* tag is pushed.
publish:
  provider: github
  owner: lucas-burlot
  repo: Capitaine
  releaseType: release

mac:
  # zip is what electron-updater downloads on macOS; dmg is for the first install.
  target: [dmg, zip]
  category: public.app-category.developer-tools
  # Version-free names keep the README's "latest/download" links valid forever.
  artifactName: Capitaine-mac-${arch}.${ext}
  # No Apple Developer certificate yet: sign ad hoc so the bundle's signature is complete. Without it the
  # app only has the linker's partial signature and Gatekeeper reports it as "damaged" instead of
  # offering "Open Anyway" (System Settings > Privacy & Security).
  identity: '-'
  # Hardened runtime + ad hoc signing rejects Electron's pre-signed frameworks (library validation).
  hardenedRuntime: false
dmg:
  # electron-updater only ever downloads the zip: a blockmap for the dmg would never be read.
  writeUpdateInfo: false
win:
  target: [nsis]
  artifactName: Capitaine-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  # deb: recommended on Ubuntu (its install sets up Chromium's sandbox); AppImage: other distros.
  target: [deb, AppImage]
  category: Development
  # One PNG per standard size (rendered from resources/icon.svg): GNOME's hicolor theme has no
  # 1024x1024 directory, so a lone 1024px icon is ignored and the app shows a generic gear.
  icon: resources/icons
  executableName: capitaine
  maintainer: Lucas Burlot <lucas-burlot@users.noreply.github.com>
  synopsis: IDE IA-first pour piloter des agents Claude Code
  desktop:
    entry:
      StartupWMClass: Capitaine
deb:
  packageName: capitaine
  artifactName: capitaine-linux-${arch}.${ext}
appImage:
  artifactName: Capitaine-linux-${arch}.${ext}
