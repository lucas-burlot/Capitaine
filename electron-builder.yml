appId: dev.capitaine.app
productName: Capitaine
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - resources/icon.png
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Development
